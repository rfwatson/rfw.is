[tools]
golangci-lint = "2.13.2"
prettier = "3.9.6"

[tasks.test]
description = "Run tests"
dir = "{{config_root}}"
run = "go test -race ./..."
alias = "t"

[tasks.lint]
description = "Run Go linter"
dir = "{{config_root}}"
run = "golangci-lint run"
alias = "l"

[tasks.deploy]
description = "Deploy site"
dir = "{{config_root}}"
run = "rsync -av dist/* apps-gateway:/opt/caddy/sites/rfw.is"
alias = "d"
